<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saddle Up</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfdbe6; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hud {
    position: fixed; left: 24px; bottom: 24px; color: #fff; user-select: none;
    background: rgba(20, 22, 18, 0.42); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; padding: 14px 16px 12px;
  }
  .gaits { display: flex; gap: 6px; }
  .gaits span {
    font-size: 13px; letter-spacing: .04em; padding: 6px 11px; border-radius: 8px;
    background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.55); transition: all .2s;
  }
  .gaits span.on { background: #f1e3c8; color: #2a1d12; font-weight: 600; }
  #spd { margin-top: 10px; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #score { margin-top: 6px; font-size: 12.5px; }
  #score .good { color: #a9e08f; } #score .bad { color: #ffab9a; }
  #toast {
    position: fixed; top: 92px; left: 50%; transform: translateX(-50%) translateY(-8px); pointer-events: none;
    font-size: 22px; font-weight: 700; letter-spacing: .01em; padding: 9px 20px; border-radius: 12px; white-space: nowrap;
    color: #fff; background: rgba(20,22,18,0.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity: 0; transition: opacity .25s, transform .25s;
  }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(15,18,12,0.35); cursor: pointer; z-index: 5; }
  #start div { display: grid; gap: 8px; text-align: center; color: #fff; background: rgba(20,22,18,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 20px 28px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.18); }
  #start b { font-size: 30px; letter-spacing: .02em; } #start em { font-style: normal; font-size: 15px; font-weight: 600; color: #f1e3c8; } #start span { font-size: 13px; opacity: .8; }
  #start.gone { display: none; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.good { background: rgba(46,120,52,0.78); } #toast.bad { background: rgba(160,44,36,0.8); }
  #toast.warn { background: rgba(176,120,20,0.8); } #toast.info { background: rgba(20,22,18,0.6); }
  #spd small { font-size: 13px; font-weight: 400; opacity: .7; margin-left: 4px; }
  #help {
    position: fixed; right: 24px; bottom: 24px; color: rgba(255,255,255,0.92); font-size: 12.5px; line-height: 1.7;
    background: rgba(20, 22, 18, 0.42); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; padding: 10px 14px; user-select: none;
  }
  #breeds {
    position: fixed; left: 50%; top: 16px; transform: translateX(-50%); color: #fff; user-select: none;
    display: flex; align-items: center; gap: 4px; max-width: calc(100vw - 32px); overflow-x: auto;
    background: rgba(20, 22, 18, 0.42); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; padding: 6px;
  }
  #breeds .title { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; opacity: .65; margin: 0 6px; white-space: nowrap; }
  #breeds button {
    display: flex; align-items: center; gap: 8px; text-align: left; cursor: pointer; white-space: nowrap;
    background: transparent; border: 0; border-radius: 9px; padding: 7px 8px; color: inherit; font: inherit;
  }
  #breeds button:hover { background: rgba(255,255,255,0.08); }
  #breeds button.on { background: #f1e3c8; color: #2a1d12; }
  #breeds .sw { width: 22px; height: 22px; border-radius: 50%; flex: none; border: 2px solid rgba(255,255,255,0.6); }
  #breeds b { display: block; font-size: 13.5px; font-weight: 600; }
  #breeds small { display: block; font-size: 11px; opacity: .7; }
  @media (max-width: 1100px) { #breeds .title { display: none; } }
  kbd { display: inline-block; min-width: 18px; text-align: center; padding: 0 5px; border-radius: 4px; background: rgba(255,255,255,0.18); font-family: inherit; font-size: 12px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="breeds"><div class="title">Mount<br><kbd>1</kbd>–<kbd>5</kbd></div></div>
<div id="hud">
  <div class="gaits"><span data-g="0">Halt</span><span data-g="1">Walk</span><span data-g="2">Trot</span><span data-g="3">Gallop</span></div>
  <div id="spd">0<small>km/h</small></div>
  <div id="score"></div>
</div>
<div id="toast"></div>
<div id="start"><div><b>Saddle Up</b><em>Click to ride</em><span>↑ ↓ gait · ← → steer · Space jump · 1–5 change mount</span></div></div>
<div id="help">
  <kbd>↑</kbd> <kbd>↓</kbd> change gait &nbsp;·&nbsp; <kbd>←</kbd> <kbd>→</kbd> steer<br>
  <kbd>Space</kbd> jump &nbsp;·&nbsp; <kbd>R</kbd> reset course<br> drag to orbit &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; <kbd>M</kbd> sound on/off
</div>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const V3 = THREE.Vector3;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const smooth = (t) => t * t * (3 - 2 * t);
const TAU = Math.PI * 2;
function hash3(v) { const s = Math.sin(v.x * 127.1 + v.y * 311.7 + v.z * 74.7) * 43758.5453; return s - Math.floor(s); }

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOG = new THREE.Color(0xc9d6e0);
scene.background = FOG;
scene.fog = new THREE.Fog(FOG, 40, 320);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1500);

const sunDir = new V3(-0.45, 0.75, -0.5).normalize();
const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x5b6a3c, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dd, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera; sc.left = -9; sc.right = 9; sc.top = 9; sc.bottom = -9; sc.near = 1; sc.far = 80;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

// sky dome (goes through the same tonemapping as fog so horizon matches)
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { sunDir: { value: sunDir }, horizon: { value: FOG }, top: { value: new THREE.Color(0x4f86cf) } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); gl_Position.z = gl_Position.w; }`,
  fragmentShader: `varying vec3 vDir; uniform vec3 sunDir, horizon, top;
    void main(){
      float h = max(vDir.y, 0.0);
      vec3 col = mix(horizon, top, pow(h, 0.55));
      float s = max(dot(normalize(vDir), sunDir), 0.0);
      col += vec3(1.0, 0.92, 0.75) * (pow(s, 900.0) * 6.0 + pow(s, 12.0) * 0.18);
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
}));
sky.frustumCulled = false;
scene.add(sky);

// ---------------------------------------------------------------- ground
function grassTexture() {
  const s = 512, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#56702f'; g.fillRect(0, 0, s, s);
  const wrapDraw = (fn) => { for (const dx of [-s, 0, s]) for (const dy of [-s, 0, s]) fn(dx, dy); };
  for (let i = 0; i < 60; i++) {
    const x = Math.random() * s, y = Math.random() * s, r = 20 + Math.random() * 60;
    const warm = Math.random() < 0.4;
    wrapDraw((dx, dy) => {
      const gr = g.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, r);
      gr.addColorStop(0, warm ? 'rgba(120,110,55,0.22)' : 'rgba(40,70,25,0.25)');
      gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(x + dx - r, y + dy - r, r * 2, r * 2);
    });
  }
  for (let i = 0; i < 9000; i++) {
    const x = Math.random() * s, y = Math.random() * s, a = Math.random() * TAU, len = 2 + Math.random() * 7;
    g.strokeStyle = `hsla(${70 + Math.random() * 35},${35 + Math.random() * 25}%,${16 + Math.random() * 24}%,0.55)`;
    g.lineWidth = 0.8 + Math.random() * 1.4;
    wrapDraw((dx, dy) => { g.beginPath(); g.moveTo(x + dx, y + dy); g.lineTo(x + dx + Math.cos(a) * len, y + dy + Math.sin(a) * len); g.stroke(); });
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const gTex = grassTexture(); gTex.repeat.set(400, 400);
const groundMat = new THREE.MeshStandardMaterial({ map: gTex, roughness: 1, metalness: 0 });
groundMat.onBeforeCompile = (sh) => {
  sh.fragmentShader = sh.fragmentShader.replace('#include <map_fragment>', `
    vec4 t1 = texture2D(map, vMapUv);
    vec4 t2 = texture2D(map, vMapUv * 0.131 + vec2(0.31, 0.71));
    vec4 t3 = texture2D(map, vMapUv * 0.019 + vec2(0.57, 0.13));
    diffuseColor.rgb *= t1.rgb * 0.5 + t2.rgb * 0.3 + t3.rgb * 0.2;`);
};
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400), groundMat);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);

// ---------------------------------------------------------------- infinite grass blades (wrapped around a moving centre)
const GRASS_R = 70, GRASS_N = 220000;
const grass = (() => {
  const base = new THREE.BufferGeometry();
  const p = [];
  const lv = [0, 0.3, 0.6, 0.85];
  for (const y of lv) { const hw = 0.5 * Math.pow(1 - y, 0.9); p.push(-hw, y, 0, hw, y, 0); }
  p.push(0, 1, 0);
  const idx = [];
  for (let i = 0; i < lv.length - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  const l = (lv.length - 1) * 2; idx.push(l, l + 1, l + 2);
  base.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); base.setIndex(idx);
  const geo = new THREE.InstancedBufferGeometry().copy(base);
  geo.instanceCount = GRASS_N;
  const off = new Float32Array(GRASS_N * 2), scl = new Float32Array(GRASS_N * 2), rot = new Float32Array(GRASS_N), vr = new Float32Array(GRASS_N);
  for (let i = 0; i < GRASS_N; i++) {
    off[i * 2] = Math.random() * GRASS_R; off[i * 2 + 1] = Math.random() * GRASS_R;
    const tall = Math.random() < 0.08 ? 1.8 : 1;
    scl[i * 2] = 0.022 + Math.random() * 0.018; scl[i * 2 + 1] = (0.12 + Math.random() * 0.22) * tall;
    rot[i] = Math.random() * TAU; vr[i] = Math.random();
  }
  geo.setAttribute('aOffset', new THREE.InstancedBufferAttribute(off, 2));
  geo.setAttribute('aScale', new THREE.InstancedBufferAttribute(scl, 2));
  geo.setAttribute('aRot', new THREE.InstancedBufferAttribute(rot, 1));
  geo.setAttribute('aVar', new THREE.InstancedBufferAttribute(vr, 1));
  const mat = new THREE.ShaderMaterial({
    side: THREE.DoubleSide,
    uniforms: {
      uCenter: { value: new V3() }, uR: { value: GRASS_R }, uTime: { value: 0 },
      uBase: { value: new THREE.Color(0x2c4214) }, uTip: { value: new THREE.Color(0x8fa246) },
      fogColor: { value: FOG }, fogNear: { value: scene.fog.near }, fogFar: { value: scene.fog.far },
      uHorse: { value: new V3() },
    },
    vertexShader: `
      uniform vec3 uCenter, uHorse; uniform float uR, uTime;
      attribute vec2 aOffset, aScale; attribute float aRot, aVar;
      varying float vH, vVar, vDepth;
      void main(){
        vec2 rel = mod(aOffset - uCenter.xz + uR * 0.5, uR) - uR * 0.5;
        vec2 wp = uCenter.xz + rel;
        float fade = 1.0 - smoothstep(uR * 0.32, uR * 0.5, length(rel));
        float h = position.y;
        vec3 p = vec3(position.x * aScale.x, h * aScale.y * fade, 0.0);
        float c = cos(aRot), s = sin(aRot);
        p = vec3(p.x * c, p.y, p.x * s);
        float w = sin(uTime * 1.6 + wp.x * 0.31 + wp.y * 0.17) * 0.6 + sin(uTime * 3.3 + wp.x * 1.7 + wp.y * 0.9) * 0.25;
        p.x += w * h * h * aScale.y * 0.35;
        p.z += w * h * h * aScale.y * 0.15;
        // flatten under the horse a little
        vec2 dh = wp - uHorse.xz; float near = 1.0 - smoothstep(0.0, 1.2, length(dh));
        p.y *= 1.0 - near * 0.6;
        vec4 mv = viewMatrix * vec4(vec3(wp.x, 0.0, wp.y) + p, 1.0);
        gl_Position = projectionMatrix * mv;
        vH = h; vVar = aVar; vDepth = -mv.z;
      }`,
    fragmentShader: `
      uniform vec3 uBase, uTip, fogColor; uniform float fogNear, fogFar;
      varying float vH, vVar, vDepth;
      void main(){
        vec3 col = mix(uBase, uTip, vH) * (0.75 + 0.5 * vVar);
        col *= 0.55 + 0.6 * vH;
        col = mix(col, fogColor, smoothstep(fogNear, fogFar, vDepth));
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  });
  const m = new THREE.Mesh(geo, mat); m.frustumCulled = false;
  scene.add(m);
  return m;
})();

// ---------------------------------------------------------------- trees & rocks
// colliders: { type, x, z, r, h } — h is how high you must be to pass over it (Infinity = can't jump it)
const colliders = [];
// the jumping course is an oval: centre (-30, 0), radii 30 (x) and 45 (z); keep it clear of trees and rocks
const COURSE = { cx: -30, cz: 0, rx: 30, rz: 45 };
const nearCourse = (x, z, m) => ((x - COURSE.cx) / (COURSE.rx + m)) ** 2 + ((z - COURSE.cz) / (COURSE.rz + m)) ** 2 < 1;
(() => {
  const rnd = (a, b) => a + Math.random() * (b - a);
  const trunkGeo = new THREE.CylinderGeometry(0.16, 0.3, 4, 8).translate(0, 2, 0);
  const blobs = [];
  for (let i = 0; i < 6; i++) {
    const g = new THREE.IcosahedronGeometry(rnd(1.4, 2.1), 2);
    const pa = g.attributes.position;
    for (let k = 0; k < pa.count; k++) { const v = new V3().fromBufferAttribute(pa, k); v.multiplyScalar(1 + (hash3(v) - 0.5) * 0.25); pa.setXYZ(k, v.x, v.y, v.z); }
    g.translate(rnd(-1.3, 1.3), rnd(4.2, 6.3), rnd(-1.3, 1.3));
    blobs.push(g);
  }
  const crownGeo = mergeGeometries(blobs.map(g => { g.deleteAttribute('normal'); g.deleteAttribute('uv'); return mergeVertices(g); })); crownGeo.computeVertexNormals();
  const N = 420;
  const trunks = new THREE.InstancedMesh(trunkGeo, new THREE.MeshStandardMaterial({ color: 0x4a3828, roughness: 1 }), N);
  const crowns = new THREE.InstancedMesh(crownGeo, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95 }), N);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new V3(), p = new V3(), c = new THREE.Color();
  for (let i = 0; i < N; i++) {
    let x, z; do { x = rnd(-650, 650); z = rnd(-650, 650); } while (Math.hypot(x, z) < 25 || nearCourse(x, z, 14));
    const k = rnd(0.7, 1.6);
    colliders.push({ type: 'tree', x, z, r: 0.32 * k, h: Infinity });
    p.set(x, 0, z); q.setFromAxisAngle(new V3(0, 1, 0), rnd(0, TAU)); s.set(k, k * rnd(0.85, 1.25), k);
    m.compose(p, q, s); trunks.setMatrixAt(i, m); crowns.setMatrixAt(i, m);
    c.setHSL(rnd(0.2, 0.3), rnd(0.35, 0.55), rnd(0.18, 0.28)); crowns.setColorAt(i, c);
  }
  for (const im of [trunks, crowns]) { im.castShadow = true; im.receiveShadow = true; scene.add(im); }

  const rockGeo = new THREE.DodecahedronGeometry(1, 2);
  const pa = rockGeo.attributes.position;
  for (let k = 0; k < pa.count; k++) { const v = new V3().fromBufferAttribute(pa, k); v.multiplyScalar(0.8 + hash3(v.clone().multiplyScalar(3)) * 0.35); v.y *= 0.6; pa.setXYZ(k, v.x, v.y, v.z); }
  rockGeo.computeVertexNormals();
  const R = 360;
  const rocks = new THREE.InstancedMesh(rockGeo, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 }), R);
  for (let i = 0; i < R; i++) {
    let x, z; do { x = rnd(-500, 500); z = rnd(-500, 500); } while (Math.hypot(x, z) < 8 || nearCourse(x, z, 6));
    const k = Math.pow(Math.random(), 3) * 1.6 + 0.15;
    p.set(x, -k * 0.15, z); q.setFromEuler(new THREE.Euler(rnd(-0.2, 0.2), rnd(0, TAU), rnd(-0.2, 0.2))); s.set(k * rnd(0.8, 1.4), k, k * rnd(0.8, 1.4));
    if (k * 0.5 > 0.2) colliders.push({ type: 'rock', x, z, r: 0.9 * k * (s.x + s.z) / (2 * k), h: k * 0.5 });
    m.compose(p, q, s); rocks.setMatrixAt(i, m);
    c.setHSL(0.08, 0.05, rnd(0.33, 0.5)); rocks.setColorAt(i, c);
  }
  rocks.castShadow = true; rocks.receiveShadow = true; scene.add(rocks);
})();

// ---------------------------------------------------------------- jumping course
const fences = [];
const looseRails = [];
(() => {
  const canvasTex = (w, h, draw, rep) => {
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 8; if (rep) t.repeat.set(rep[0], rep[1]); return t;
  };
  const stripes = (a, b, n) => canvasTex(4, 256, (g, w, h) => { for (let i = 0; i < n; i++) { g.fillStyle = i % 2 ? b : a; g.fillRect(0, i * h / n, w, h / n + 1); } });
  const SCHEMES = [['#f4f1ea', '#c0262d'], ['#f4f1ea', '#1f4fa3'], ['#f4f1ea', '#2f7a3a'], ['#1d1d1d', '#e8b923'], ['#f4f1ea', '#e07a1f']];
  const railMats = SCHEMES.map(([a, b]) => new THREE.MeshStandardMaterial({ map: stripes(a, b, 8), roughness: 0.55 }));
  const postMats = SCHEMES.map(([a, b]) => new THREE.MeshStandardMaterial({ map: stripes(a, b, 10), roughness: 0.6 }));
  const white = new THREE.MeshStandardMaterial({ color: 0xf2efe8, roughness: 0.6 });
  const brick = new THREE.MeshStandardMaterial({ roughness: 0.9, map: canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#d9d2c4'; g.fillRect(0, 0, w, h);
    for (let r = 0; r < 8; r++) for (let c = -1; c < 5; c++) {
      g.fillStyle = `hsl(${8 + Math.random() * 10},${45 + Math.random() * 15}%,${36 + Math.random() * 10}%)`;
      g.fillRect(c * 64 + (r % 2) * 32 + 3, r * 32 + 3, 58, 26);
    }
  }, [3, 1]) });
  const bark = new THREE.MeshStandardMaterial({ roughness: 0.95, map: canvasTex(128, 256, (g, w, h) => {
    g.fillStyle = '#5a4532'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(${30 + Math.random() * 40},${22 + Math.random() * 25},${14 + Math.random() * 15},0.6)`; g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 3, 6 + Math.random() * 30); }
  }, [3, 1]) });
  const logEnd = new THREE.MeshStandardMaterial({ color: 0xb08a5c, roughness: 0.9 });
  const hedgeMat = new THREE.MeshStandardMaterial({ color: 0x3d5e25, roughness: 1 });
  const numberMat = (n) => new THREE.MeshStandardMaterial({ roughness: 0.7, map: canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#f7f4ec'; g.fillRect(0, 0, w, h); g.strokeStyle = '#222'; g.lineWidth = 8; g.strokeRect(4, 4, w - 8, h - 8);
    g.fillStyle = '#1a1a1a'; g.font = 'bold 78px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(n), w / 2, h / 2 + 4);
  }) });
  const shadow = (m) => { m.castShadow = true; m.receiveShadow = true; return m; };

  const RAIL_R = 0.05, RAIL_HALF = 1.8;
  const railGeo = new THREE.CylinderGeometry(RAIL_R, RAIL_R, RAIL_HALF * 2, 14).rotateZ(Math.PI / 2);
  const postGeo = new THREE.BoxGeometry(0.09, 1.75, 0.09).translate(0, 0.875, 0);

function recomputeFence(f) {
  if (f.solid) return;
  f.h = f.rails.reduce((m, r) => r.down ? m : Math.max(m, r.top), 0);

function knockRail(f, rail, dir, speed) {
  if (rail.down) return;
  rail.down = true;
  const m = rail.mesh;
  const tilt = m.rotation.z;
  scene.attach(m); // keep world transform
  const yawAxis = new V3(1, 0, 0).applyQuaternion(m.quaternion); yawAxis.y = 0; yawAxis.normalize();
  rail.body = {
    v: new V3(dir.x * (0.6 + speed * 0.35), 1.2 + Math.random() * 1.4, dir.z * (0.6 + speed * 0.35)).add(new V3((Math.random() - 0.5), 0, (Math.random() - 0.5))),
    spin: (Math.random() - 0.5) * 2.2,          // yaw spin (rad/s)
    roll: 0,                                     // roll around its own axis
    tilt,                                        // crossrail tilt flattens on the ground
    yaw: Math.atan2(-yawAxis.z, yawAxis.x),
    rest: false,

function updateRails(dt) {
  const q = new THREE.Quaternion(), e = new THREE.Euler(0, 0, 0, 'YZX');
  for (const r of looseRails) {
    const b = r.body; if (!b || b.rest) continue;
    const m = r.mesh;
    b.v.y -= GRAV * dt;
    m.position.addScaledVector(b.v, dt);
    b.yaw += b.spin * dt;
    const axis = new V3(Math.cos(b.yaw), 0, -Math.sin(b.yaw));
    if (m.position.y <= 0.05) {
      m.position.y = 0.05;
      if (b.v.y < -0.6) { b.v.y *= -0.28; railClack(Math.min(1, -b.v.y)); } else b.v.y = 0;
      b.tilt = damp(b.tilt, 0, 10, dt);
      // friction along the rail axis, rolling perpendicular to it
      const along = axis.clone().multiplyScalar(b.v.dot(axis));
      const perp = new V3(b.v.x, 0, b.v.z).sub(along);
      along.multiplyScalar(Math.exp(-6 * dt)); perp.multiplyScalar(Math.exp(-1.6 * dt));
      b.v.x = along.x + perp.x; b.v.z = along.z + perp.z;
      b.spin *= Math.exp(-5 * dt);
      const side = new V3(-axis.z, 0, axis.x);
      b.roll += perp.dot(side) / 0.05 * dt;
      if (Math.hypot(b.v.x, b.v.z) < 0.03 && Math.abs(b.v.y) < 0.01) b.rest = true;

function loft(secs, { radial = 28, steps = 10, colorFn = null, color = 0x1c1511 } = {}) {
  const N = secs.length;

  const D = new THREE.CatmullRomCurve3(secs.map(s => new V3(s.w, s.ht ?? s.h, s.hb ?? s.h)), false, 'catmullrom', 0.5);

  const base = new THREE.Color(), out = new THREE.Color();
  for (let i = 0; i < rings; i++) {

    tan.x = 0; if (tan.lengthSq() < 1e-8) tan.set(0, 0, 1); tan.normalize();
    nrm.crossVectors(tan, side).normalize();

      col.push(out.r * nz, out.g * nz, out.b * nz);
    }
  }
  const s0 = pos.length / 3;
  P.getPoint(0, p); pos.push(p.x, p.y, p.z); col.push(col[0], col[1], col[2]);
  P.getPoint(1, p); pos.push(p.x, p.y, p.z); const L = (rings - 1) * radial; col.push(col[L * 3], col[L * 3 + 1], col[L * 3 + 2]);

    const a = i * radial + j, b = i * radial + (j + 1) % radial, c = a + radial, e = b + radial;
    idx.push(a, b, c, b, e, c);

  for (let j = 0; j < radial; j++) {
    idx.push(s0, (j + 1) % radial, j);
    idx.push(s0 + 1, L + j, L + (j + 1) % radial);
  }

  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));

}

const GAITS = [
  null,
  { v: 1.7, f: 1.0, d: 0.62, offs: [0.25, 0.75, 0.0, 0.5], liftF: 0.13, liftH: 0.09, flexF: 1.1, flexH: 0.9 },

  { v: 9.5, f: 2.25, d: 0.27, offs: [0.47, 0.58, 0.0, 0.12], liftF: 0.32, liftH: 0.22, flexF: 2.2, flexH: 1.5 },
];
const GAIT_SPEED = [0, 1.7, 4.2, 9.5];
const GAIT_NAME = ['Halt', 'Walk', 'Trot', 'Gallop'];

function gaitParams(v) {
  const G = GAITS;
  const out = { offs: [0, 0, 0, 0], amp: 1, w: [0, 0, 0] };
  let a, b, t;
  if (v <= G[1].v) { a = b = G[1]; t = 0; out.amp = v / G[1].v; }
  else if (v <= G[2].v) { a = G[1]; b = G[2]; t = (v - a.v) / (b.v - a.v); }
  else { a = G[2]; b = G[3]; t = clamp((v - a.v) / (b.v - a.v), 0, 1); }
  t = smooth(t);
  for (const k of ['f', 'd', 'liftF', 'liftH', 'flexF', 'flexH']) out[k] = lerp(a[k], b[k], t);
  for (let i = 0; i < 4; i++) out.offs[i] = lerp(a.offs[i], b.offs[i], t);
  const g = v <= G[1].v ? 1 : v <= G[2].v ? 1 + t : 2 + t;
  out.w = [Math.max(0, 1 - Math.abs(g - 1)), Math.max(0, 1 - Math.abs(g - 2)), Math.max(0, 1 - Math.abs(g - 3))];
  out.w[0] *= out.amp; out.w[1] *= out.amp; out.w[2] *= out.amp;
  return out;
}

// ---------------------------------------------------------------- dust
const DUST_N = 500;
const dust = (() => {
  const pos = new Float32Array(DUST_N * 3), life = new Float32Array(DUST_N), size = new Float32Array(DUST_N);
  const vel = new Float32Array(DUST_N * 3), max = new Float32Array(DUST_N);

  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aLife', new THREE.BufferAttribute(life, 1));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uColor: { value: new THREE.Color(0xb7a88a) }, uScale: { value: innerHeight } },
    vertexShader: `attribute float aLife, aSize; varying float vL; uniform float uScale;
      void main(){ vL = aLife; vec4 mv = modelViewMatrix * vec4(position,1.); gl_Position = projectionMatrix * mv;
      gl_PointSize = aLife > 0.0 ? aSize * uScale * 0.5 / -mv.z : 0.0; }`,
    fragmentShader: `uniform vec3 uColor; varying float vL;
      void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, d) * vL * 0.28; if (a < 0.003) discard;
      gl_FragColor = vec4(uColor, a);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      }`
  });
  const pts = new THREE.Points(geo, mat); pts.frustumCulled = false; scene.add(pts);
  let next = 0;
  return {
    mat,
    spawn(p, n, strength) {
      for (let k = 0; k < n; k++) {
        const i = next; next = (next + 1) % DUST_N;
        pos[i * 3] = p.x + (Math.random() - 0.5) * 0.15; pos[i * 3 + 1] = 0.04; pos[i * 3 + 2] = p.z + (Math.random() - 0.5) * 0.15;
        const a = Math.random() * TAU, s = (0.2 + Math.random() * 0.5) * strength;
        vel[i * 3] = Math.cos(a) * s; vel[i * 3 + 1] = (0.25 + Math.random() * 0.45) * strength; vel[i * 3 + 2] = Math.sin(a) * s;
        max[i] = 0.9 + Math.random() * 0.8; life[i] = 1; size[i] = 0.15;
      }
    },
    update(dt) {
      for (let i = 0; i < DUST_N; i++) {
        if (life[i] <= 0) continue;

        pos[i * 3] += vel[i * 3] * dt; pos[i * 3 + 1] += vel[i * 3 + 1] * dt; pos[i * 3 + 2] += vel[i * 3 + 2] * dt;
        vel[i * 3] *= 0.96; vel[i * 3 + 1] *= 0.94; vel[i * 3 + 2] *= 0.96;
        size[i] += dt * 0.55;
      }
      geo.attributes.position.needsUpdate = geo.attributes.aLife.needsUpdate = geo.attributes.aSize.needsUpdate = true;
    }
  };
})();

// camera orbit
let camYawOff = 0, camPitch = 0.22, camDist = 6.5, dragging = false, lastX = 0, lastY = 0, lastDrag = -10;

// ---------------------------------------------------------------- simulation state

// ---------------------------------------------------------------- jumping
const GRAV = 9.8, PREP_T = 0.2, LAND_T = 0.32;
function startJump() {
  if (st.jump || !H || st.stun > 0) return;
  const g = clamp(st.speed / H.B.speed / 9.5, 0, 1);            // 0 standing .. 1 full gallop
  st.jump = { state: 'prep', t: 0, y: 0, vy: 0, T: 1, h: lerp(0.55, 1.15, g) * H.B.S * (0.7 + 0.3 * H.B.k) };
}
// keyframes [u, y, z, flex] for each leg pair while airborne (horse-local units, scaled by leg length later)
const AIR_FRONT = [[0, 0.30, 0.10, 1.8], [0.15, 0.44, 0.14, 2.5], [0.6, 0.44, 0.14, 2.4], [0.85, 0.14, 0.26, 0.7], [1, 0.02, 0.24, 0.25]];

  let i = 0; while (i < table.length - 2 && u > table[i + 1][0]) i++;
  const a = table[i], b = table[i + 1], t = smooth(clamp((u - a[0]) / (b[0] - a[0]), 0, 1));
  out[0] = lerp(a[1], b[1], t); out[1] = lerp(a[2], b[2], t); out[2] = lerp(a[3], b[3], t);

}
const _kf = [0, 0, 0];
function hoofThud(intensity) { hoofSound(intensity, -0.2); setTimeout(() => hoofSound(intensity * 0.9, 0.2), 45); }

// ---------------------------------------------------------------- collisions & crashes
const score = { clears: 0, faults: 0 };
let shake = 0;
function railClack(v) {
  if (!actx || muted) return;
  const t = actx.currentTime + 0.003;
  const n = actx.createBufferSource(); n.buffer = noiseBuf;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1300 + Math.random() * 700; bp.Q.value = 5;
  const g = actx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05 + 0.9 * v, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
  n.connect(bp).connect(g).connect(master); n.start(t); n.stop(t + 0.16);
}
function crashSound(v) { hoofSound(Math.min(1.3, 0.7 + v * 0.07), 0); setTimeout(() => hoofSound(0.6, 0.15), 70); setTimeout(() => hoofSound(0.4, -0.15), 160); }
const toastEl = document.getElementById('toast'), scoreEl = document.getElementById('score');
let toastTimer = 0;
function toast(msg, kind) {
  toastEl.textContent = msg; toastEl.className = 'show ' + kind;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.className = kind; }, 1800);
}
function updateScore() { scoreEl.innerHTML = `<span class="good">✓ ${score.clears} clear</span> &nbsp; <span class="bad">✗ ${score.faults} fault${score.faults === 1 ? '' : 's'}</span>`; }

function crash(hit, v, air) {
  const J = st.jump;
  let msg;
  if (hit.c) {
    msg = hit.c.type === 'tree' ? 'Ouch! Ran into a tree' : hit.c.type === 'wing' ? 'Hit the wing — aim for the middle'
      : air ? 'Too low — hit the rock' : 'Blocked by a rock — jump it!';
  } else {
    const f = hit.f; f.faultT = 0;
    msg = J && J.state === 'prep' ? `Took off too late at fence ${f.num}` : !air ? `Refusal at fence ${f.num}!` : J && J.vy < 0 ? `Took off too early at fence ${f.num}` : `Took off too late at fence ${f.num}`;
    if (!f.solid && (air || v > 4)) {
      f.rails.forEach(r => knockRail(f, r, { x: -hit.nx, z: -hit.nz }, v));
      railClack(1); setTimeout(() => railClack(0.7), 90);
    }
  }
  st.speed = 0; setGait(0); st.stun = 1.1;
  const push = Math.min(3.2, 0.8 + v * 0.3);
  st.rvx = hit.nx * push; st.rvz = hit.nz * push;
  shake = Math.min(0.35, 0.06 + v * 0.03);
  if (J) { if (J.state === 'prep') st.jump = null; else if (J.state === 'air') J.vy = Math.min(J.vy, 0); }

}

// pushes the horse out of anything it overlaps and reports the first blocking contact
function checkCollisions(dt) {
  const B = H.B, S = B.S, J = st.jump;
  const fx = Math.sin(st.yaw), fz = Math.cos(st.yaw);
  const air = !!(J && J.state === 'air');
  const clear = J ? J.y + (air ? 0.3 * S * B.k : 0) : 0;    // hooves tuck up while airborne
  const r = 0.3 * S * B.bodyW;
  const offs = [0.95 * S, 0, -0.85 * S];                      // chest, barrel, hindquarters
  let hit = null;
  for (const c of colliders) {
    if (Math.abs(st.x - c.x) > c.r + 2.5 || Math.abs(st.z - c.z) > c.r + 2.5) continue;
    if (clear >= c.h) continue;
    for (const o of offs) {
      const dx = st.x + fx * o - c.x, dz = st.z + fz * o - c.z, d = Math.hypot(dx, dz), min = c.r + r;
      if (d >= min) continue;
      const nx = d > 1e-4 ? dx / d : -fx, nz = d > 1e-4 ? dz / d : -fz;
      st.x += nx * (min - d); st.z += nz * (min - d);
      if (!hit) hit = { c, nx, nz };
    }
  }
  for (const f of fences) {
    f.faultT += dt;
    const dx0 = st.x - f.x, dz0 = st.z - f.z;
    const lxC = dx0 * f.ax.x + dz0 * f.ax.z, lzC = dx0 * f.az.x + dz0 * f.az.z;
    // rails go back up once the horse has moved away
    if (f.rails.some(rl => rl.down)) { f.downT += dt; if (f.downT > 6 && Math.hypot(dx0, dz0) > 8) resetFence(f); }
    if (Math.abs(lxC) > 6 || Math.abs(lzC) > 6) { f.side = 0; continue; }
    const side = lzC >= 0 ? 1 : -1;
    if (f.side && side !== f.side && Math.abs(lxC) < f.L + 0.3 && J && f.faultT > 1.0) {
      score.clears++; updateScore(); toast(`Clear! Fence ${f.num}`, 'good');
    }
    f.side = side;
    if (f.clipped && f.faultT > 1.5) f.clipped = false;
    if (f.h <= 0.01) continue;
    for (const o of offs) {
      const dx = st.x + fx * o - f.x, dz = st.z + fz * o - f.z;
      const lx = dx * f.ax.x + dz * f.ax.z, lz = dx * f.az.x + dz * f.az.z;
      if (Math.abs(lx) > f.L || Math.abs(lz) > f.D + r) continue;
      if (clear >= f.h) continue;
      const deficit = f.h - clear;
      if (air && deficit < 0.28 * S) {           // just clipped it: penalty, but the horse keeps going
        if (!f.clipped) {
          f.clipped = true; f.faultT = 0;

            const top = f.rails.filter(rl => !rl.down).sort((a, b) => b.top - a.top)[0];
            if (top) knockRail(f, top, { x: fx, z: fz }, st.speed);
            railClack(1); toast(`Rail down at fence ${f.num}`, 'warn');
          } else { hoofSound(0.8, 0); toast(`Rapped fence ${f.num}`, 'warn'); }
          score.faults++; updateScore();
        }

      const sgn = lz >= 0 ? 1 : -1, pen = f.D + r - Math.abs(lz);
      st.x += f.az.x * sgn * pen; st.z += f.az.z * sgn * pen;
      if (!hit) hit = { f, nx: f.az.x * sgn, nz: f.az.z * sgn };
    }
  }
  if (hit && st.stun <= 0) {
    const into = -(fx * hit.nx + fz * hit.nz);

}

function resetCourse() {
  fences.forEach(f => { resetFence(f); f.faultT = 99; f.side = 0; f.clipped = false; });
  score.clears = score.faults = 0; updateScore();
  placeAtStart(); st.speed = 0; st.jump = null; st.stun = 0; st.rvx = st.rvz = 0; setGait(0);
  toast('Course reset', 'info');
}
// start on the track, lined up 14 m before fence 1
function placeAtStart() {
  const f = fences[0];
  st.x = f.x - f.az.x * 14; st.z = f.z - f.az.z * 14; st.yaw = f.ang;
  camState.yaw = st.yaw; camState.pos.set(st.x - Math.sin(st.yaw) * 7, 2.5, st.z - Math.cos(st.yaw) * 7);
}

let idle = 0;
const clock = new THREE.Clock();
const tmp = new V3(), hw = new V3();

function updateHorse(dt, time) {
  const { root: horse, body, legs, neck, head, ears, tailSegs, B } = H;
  const k = B.k, SM = B.speed;
  // --- locomotion
  st.stun = Math.max(0, st.stun - dt);
  const target = st.stun > 0 ? 0 : GAIT_SPEED[gait] * SM;
  st.speed = st.speed < target ? Math.min(target, st.speed + 2.6 * dt) : Math.max(target, st.speed - 4.0 * dt);
  const tIn = ((keys.ArrowLeft || keys.a || keys.A) ? 1 : 0) - ((keys.ArrowRight || keys.d || keys.D) ? 1 : 0);
  st.turn = damp(st.turn, tIn, 6, dt);
  const turnRate = st.speed < 0.2 ? 0.8 : lerp(1.15, 0.7, clamp((st.speed / SM - 1.7) / 7.8, 0, 1));
  st.yaw += st.turn * turnRate * dt;

    J.t += dt;

      jPitch = -0.24 * smooth(u); jCrouch = 0.07 * smooth(u); jNeck = -0.18 * smooth(u); jW = smooth(u);

        hoofThud(0.5 + 0.4 * B.S);
      }

      J.vy -= GRAV * dt; J.y += J.vy * dt;
      const u = clamp(J.t / J.T, 0, 1);
      jPitch = lerp(-0.3, 0.2, smooth(u)); jNeck = lerp(-0.12, 0.32, smooth(u)); jW = 1; jTail = 0.35 * Math.sin(Math.PI * u);
      if (J.y <= 0 && J.t > 0.05) {
        J.y = 0; J.state = 'land'; J.t = 0;
        hoofThud(0.8 + 0.4 * B.S);
        H.legs.forEach(L => { L.hoof.getWorldPosition(hw); dust.spawn(hw, 5, (0.6 + J.h * 0.5) * B.S); });
      }
    } else {
      const u = clamp(J.t / LAND_T, 0, 1);
      jPitch = lerp(0.16, 0, smooth(u)); jCrouch = 0.09 * Math.sin(Math.PI * u); jNeck = lerp(0.25, 0, smooth(u)); jW = 1 - smooth(u);

    L.knee.rotation.x = a2w - a1;
    const cannonWorld = body.rotation.x + L.root.rotation.x + a2w;
    L.fet.rotation.x = (PAST_ANG + L.flex) - cannonWorld;
    L.hoof.rotation.x = -PAST_ANG;

  // --- head & neck
  st.graze = damp(st.graze, idle > 6 ? 1 : 0, idle > 6 ? 0.8 : 3, dt);
  const gz = st.graze;
  const nod = ww * 0.06 * Math.sin(TAU * 2 * (ph - 0.1)) + wt * 0.015 * Math.sin(TAU * 2 * ph) + wg * 0.12 * Math.sin(TAU * (ph - 0.2));

  head.rotation.x = 0.82 - wg * 0.18 + gz * 0.25 + 0.03 * Math.sin(time * 0.9) * (1 - clamp(st.speed, 0, 1));
  head.rotation.y = st.turn * 0.15;
  head.rotation.z = gz * 0.05 * Math.sin(time * 4.5); // chewing wiggle

  // ears: forward when moving, random flicks when idle
  for (const e of ears) {
    const u = e.userData;
    u.t -= dt;
    if (u.t < 0) { u.t = 1.5 + Math.random() * 4; u.target = (Math.random() - 0.3) * 0.7; }
    const goal = st.speed > 0.5 ? -0.2 + (-st.turn * u.sx) * 0.2 : u.target;
    u.cur = damp(u.cur, goal, 5, dt);
    e.rotation.x = u.base + u.cur * 0.5;
    e.rotation.y = u.sx * (u.cur * 0.6 + 0.15);
    e.rotation.z = -u.sx * u.spread;
  }

  // tail
  st.swishT -= dt;
  if (st.swishT < 0) { st.swishT = 3 + Math.random() * 6; st.swish = 0.35; }
  st.swish = damp(st.swish, 0, 0.9, dt);
  const run = clamp((st.speed / SM - 2) / 7, 0, 1);
  tailSegs.forEach((g, i) => {
    g.rotation.x = lerp(TAIL_REST[i], TAIL_RUN[i], run) + (i === 0 ? jTail : jTail * 0.3) + run * 0.06 * Math.sin(time * 13 - i * 0.8) + (wt + wg) * 0.04 * Math.sin(TAU * 2 * ph - i * 0.5);
    g.rotation.z = (st.swish * 1.0 + 0.03) * Math.sin(time * 3.2 - i * 0.55) * (0.3 + i * 0.12) - st.turn * 0.05 * (i > 0 ? 1 : 0);
  });
}

// ---------------------------------------------------------------- camera
const camState = { yaw: 0, pos: new V3(0, 2.5, -7), look: new V3() };
function updateCamera(dt, time) {
  if (!dragging && time - lastDrag > 2.5 && st.speed > 0.3) camYawOff = damp(camYawOff, 0, 0.8, dt);
  let d = st.yaw + camYawOff - camState.yaw;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  camState.yaw += d * (1 - Math.exp(-(dragging ? 20 : 3) * dt));
  const tgt = new V3(st.x, (1.25 - 0.3 * st.graze) * H.B.S * (0.6 + 0.4 * H.B.k) + (st.jump ? st.jump.y * 0.6 : 0), st.z);
  const dist = camDist * (1 + clamp(st.speed / 9.5, 0, 1) * 0.15) * (0.45 + 0.55 * H.B.S);
  const want = new V3(
    tgt.x - Math.sin(camState.yaw) * Math.cos(camPitch) * dist,
    tgt.y + Math.sin(camPitch) * dist,
    tgt.z - Math.cos(camState.yaw) * Math.cos(camPitch) * dist);
  want.y = Math.max(want.y, 0.3);
  camState.pos.lerp(want, 1 - Math.exp(-10 * dt));
  camState.look.lerp(tgt, 1 - Math.exp(-12 * dt));
  camera.position.copy(camState.pos);
  if (shake > 0.002) { camera.position.x += (Math.random() - 0.5) * shake; camera.position.y += (Math.random() - 0.5) * shake; shake = damp(shake, 0, 6, dt); }
  camera.lookAt(camState.look);

  // shadow + grass follow
  sun.position.set(st.x, 0, st.z).addScaledVector(sunDir, 40);
  sun.target.position.set(st.x, 0, st.z);
  const fwd = new V3().subVectors(camState.look, camState.pos).setY(0).normalize();
  grass.material.uniforms.uCenter.value.set(st.x + fwd.x * 14, 0, st.z + fwd.z * 14);
  grass.material.uniforms.uHorse.value.set(st.x, 0, st.z);
  grass.material.uniforms.uTime.value = time;
  sky.position.copy(camera.position);
}

// ---------------------------------------------------------------- loop
setBreed(0);
updateScore();
placeAtStart();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;
  updateHorse(dt, time);
  updateRails(dt);
  updateCamera(dt, time);
  dust.update(dt);
  hudS.innerHTML = `${(st.speed * 3.6).toFixed(0)}<small>km/h</small>`;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  dust.mat.uniforms.uScale.value = innerHeight;
});

// debug hooks
let simT = 1000;
window.__horse = { st, setGait, setBreed, startJump, fences, colliders, resetCourse, score, step: (n, dt = 1 / 60) => { for (let i = 0; i < n; i++) { simT += dt; updateHorse(dt, simT); updateRails(dt); dust.update(dt); updateCamera(dt, simT); } renderer.render(scene, camera); }, camera, scene, get H() { return H; }, setCam: (yawOff, pitch, dist) => { camYawOff = yawOff; camPitch = pitch; camDist = dist; lastDrag = 1e9; } };
</script>
</body>
